<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Random Games Casino</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-dark: #07090e;
      --card-bg: #121824;
      --accent-cyan: #00f2fe;
      --accent-gold: #ffb703;
      --accent-red: #ff2d55;
      --accent-green: #2ed573;
      --accent-gold-gradient: linear-gradient(135deg, #ffd166, #ff9e00);
      --btn-green-gradient: linear-gradient(135deg, #2ed573, #10ac84);
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --border-color: rgba(255, 255, 255, 0.08);
      --nav-bg: rgba(14, 18, 26, 0.95);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 90px;
    }

    .header {
      width: 100%; max-width: 480px; display: flex; justify-content: space-between; align-items: center;
      padding: 12px 16px; background: var(--bg-dark); position: sticky; top: 0; z-index: 100;
    }

    .brand-logo {
      background: rgba(255, 255, 255, 0.06); border: 1px solid var(--border-color);
      padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 700; color: #00f2fe;
      display: flex; align-items: center; gap: 6px;
    }

    .header-right { display: flex; align-items: center; gap: 8px; }
    .btn-connect { background: #0098ea; color: #fff; border: none; padding: 6px 14px; border-radius: 16px; font-size: 13px; font-weight: 700; cursor: pointer; }

    .balance-pill {
      background: var(--card-bg); border: 1px solid var(--border-color); padding: 6px 14px;
      border-radius: 16px; font-size: 13px; font-weight: 800; color: var(--accent-gold); cursor: pointer;
      display: flex; align-items: center; gap: 4px;
    }

    .main-container {
      width: 100%; max-width: 480px; padding: 0 16px; display: flex; flex-direction: column; gap: 16px;
    }

    .promo-banner {
      width: 100%; background: linear-gradient(135deg, #ff9e00 0%, #ff5100 100%);
      border-radius: 20px; padding: 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer;
      box-shadow: 0 8px 24px rgba(255, 110, 0, 0.25);
    }

    .section-title { font-size: 16px; font-weight: 800; margin-bottom: 10px; }

    .games-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .game-card {
      background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px;
      padding: 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 10px; cursor: pointer;
    }
    .game-thumb { width: 100%; height: 75px; background: rgba(0, 0, 0, 0.2); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 32px; }
    .game-name { font-size: 12px; font-weight: 700; text-align: center; }

    .game-view { display: none; flex-direction: column; gap: 12px; width: 100%; }
    .nav-back-row { display: flex; align-items: center; justify-content: space-between; }
    .btn-back { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-muted); padding: 6px 14px; border-radius: 16px; font-size: 13px; font-weight: 700; cursor: pointer; }

    /* ЭКРАН РАКЕТКИ КАК НА ВИДЕО */
    .rocket-screen {
      width: 100%; height: 230px; background: radial-gradient(circle at center, #181d2d 0%, #07090e 100%);
      border: 1px solid var(--border-color); border-radius: 24px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; position: relative; overflow: hidden;
    }

    .star-sparkle { position: absolute; background: #fff; border-radius: 50%; opacity: 0.6; }

    .rocket-mult {
      font-size: 58px; font-weight: 900; color: var(--accent-red);
      text-shadow: 0 0 25px rgba(255, 45, 85, 0.5); z-index: 2; letter-spacing: -1px;
    }

    .history-strip { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0; scrollbar-width: none; }
    .history-strip::-webkit-scrollbar { display: none; }
    .history-pill { background: var(--card-bg); border: 1px solid var(--border-color); padding: 5px 12px; border-radius: 14px; font-size: 12px; font-weight: 800; white-space: nowrap; }

    .bet-box { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
    .bet-label { text-align: center; font-size: 13px; color: var(--text-muted); font-weight: 600; }
    .bet-display-row { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 26px; font-weight: 900; color: #fff; }
    .bet-sub-currency { font-size: 12px; color: var(--text-muted); text-align: center; margin-top: -8px; }

    .quick-btns-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .q-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color); color: var(--text-main); padding: 10px; border-radius: 14px; font-size: 13px; font-weight: 700; cursor: pointer; text-align: center; }

    .auto-cashout-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--text-muted); border-top: 1px solid var(--border-color); padding-top: 10px; }
    .toggle-switch { position: relative; display: inline-block; width: 40px; height: 22px; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(255,255,255,0.1); transition: .2s; border-radius: 22px; }
    .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .2s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--accent-cyan); }
    input:checked + .slider:before { transform: translateX(18px); }

    .btn-bet-execute {
      width: 100%; padding: 15px; border: none; border-radius: 16px; font-size: 16px; font-weight: 800; cursor: pointer;
      background: var(--btn-green-gradient); color: #fff; box-shadow: 0 4px 20px rgba(46, 213, 115, 0.3);
      transition: transform 0.1s;
    }
    .btn-bet-execute:active { transform: scale(0.98); }

    /* СПИСОК УЧАСТНИКОВ КАК НА ВИДЕО */
    .participants-section {
      background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 14px;
      display: flex; flex-direction: column; gap: 8px; max-height: 220px; overflow-y: auto;
    }
    .participants-header { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 4px; }
    .participant-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.03); }
    .participant-user { display: flex; align-items: center; gap: 8px; font-weight: 700; }
    .participant-avatar { width: 24px; height: 24px; border-radius: 50%; background: #333; display: flex; align-items: center; justify-content: center; font-size: 11px; }
    .participant-win { color: var(--accent-red); font-weight: 800; }
    .participant-win.success { color: var(--accent-green); }

    .nav-bar {
      position: fixed; bottom: 0; left: 0; right: 0; background: var(--nav-bg); backdrop-filter: blur(20px);
      border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; padding: 12px 0 24px 0; z-index: 1000; max-width: 480px; margin: 0 auto;
      border-top-left-radius: 28px; border-top-right-radius: 28px;
    }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-muted); font-size: 11px; font-weight: 700; cursor: pointer; background: transparent; border: none; }
    .nav-item.active { color: var(--accent-cyan); }
    .nav-icon { font-size: 20px; }

    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); display: none; align-items: flex-end; justify-content: center; z-index: 2000; }
    .modal-content { width: 100%; max-width: 480px; background: #141925; border-top-left-radius: 28px; border-top-right-radius: 28px; padding: 24px 20px 36px 20px; border-top: 1px solid var(--border-color); }
  </style>
</head>
<body>

  <header class="header">
    <div class="brand-logo">🎮 Random Games</div>
    <div class="header-right">
      <button class="btn-connect" onclick="alert('Кошелек подключен!')">Connect</button>
      <div class="balance-pill" onclick="openCashier()">⭐ <span id="balanceText">0</span> Stars</div>
    </div>
  </header>

  <div class="main-container" id="viewHome">
    <div class="promo-banner" onclick="openCashier()">
      <div>
        <div style="font-size:18px; font-weight:900; color:#fff;">Бесплатный кейс</div>
        <div style="font-size:13px; font-weight:700; color:rgba(255,255,255,0.9);">за подписку на канал</div>
      </div>
      <div style="font-size: 40px;">🎁</div>
    </div>

    <div>
      <div class="section-title">🔥 Лучшие игры</div>
      <div class="games-grid">
        <div class="game-card" onclick="alert('Скоро')"><div class="game-thumb">💎</div><div class="game-name">Апгрейдер</div></div>
        <div class="game-card" onclick="switchView('rocket')">
          <div class="game-thumb" style="border: 1px solid rgba(255,45,85,0.4); background: radial-gradient(circle, #1f1018 0%, #121824 100%);">🚀</div>
          <div class="game-name">Ракетка</div>
        </div>
        <div class="game-card" onclick="alert('Скоро')"><div class="game-thumb">⚔️</div><div class="game-name">PVP</div></div>
      </div>
    </div>
  </div>

  <!-- ИГРА РАКЕТКА ТОЧЬ-В-ТОЧЬ КАК НА ВИДЕО -->
  <div class="main-container game-view" id="viewRocket">
    <div class="nav-back-row">
      <button class="btn-back" onclick="switchView('home')">❮ Назад</button>
      <span style="font-weight:800; font-size:15px; color:var(--accent-red);">🚀 Ракетка</span>
      <div style="width: 60px;"></div>
    </div>

    <div class="rocket-screen">
      <div class="star-sparkle" style="top:50px; left:40px; width:3px; height:3px;"></div>
      <div class="star-sparkle" style="bottom:60px; right:50px; width:4px; height:4px;"></div>
      <div class="rocket-mult" id="rocketDisplay">1.00x</div>
    </div>

    <div class="history-strip" id="historyStrip">
      <div class="history-pill" style="color:var(--accent-cyan)">1.15x</div>
      <div class="history-pill" style="color:var(--accent-gold)">5.27x</div>
      <div class="history-pill" style="color:var(--accent-green)">2.08x</div>
    </div>

    <!-- СТАВКА -->
    <div class="bet-box">
      <div class="bet-label">Введите сумму ставки</div>
      <div class="bet-display-row"><span>⭐</span><span id="betText1">10</span></div>
      <div class="bet-sub-currency">≈ $<span id="usdText1">0.15</span></div>

      <div class="quick-btns-grid">
        <button class="q-btn" onclick="changeBet(1, -10)">-10</button>
        <button class="q-btn" onclick="changeBet(1, 50)">+50</button>
        <button class="q-btn" onclick="changeBet(1, 'max')">MAX</button>
      </div>

      <div class="auto-cashout-row">
        <span>Автовывод</span>
        <label class="toggle-switch">
          <input type="checkbox" id="autoToggle1">
          <span class="slider"></span>
        </label>
      </div>

      <button class="btn-action btn-bet-execute" id="btnBet1" onclick="handleRocketBet()">🚀 Сделать ставку</button>
    </div>

    <!-- СПИСОК УЧАСТНИКОВ (БОТЫ КАК НА ВИДЕО) -->
    <div class="participants-section">
      <div class="participants-header">
        <span>Список участников</span>
        <span id="participantsStatus">⌛ Ожидание</span>
      </div>
      <div id="participantsList" style="display:flex; flex-direction:column; gap:6px;"></div>
    </div>
  </div>

  <nav class="nav-bar">
    <button class="nav-item active" onclick="switchView('home')"><span class="nav-icon">🏠</span>Главная</button>
    <button class="nav-item" onclick="openCashier()"><span class="nav-icon">📦</span>Кейсы</button>
    <button class="nav-item" onclick="openCashier()"><span class="nav-icon">📊</span>Лидеры</button>
    <button class="nav-item" onclick="openAdminModal()"><span class="nav-icon">👤</span>Профиль</button>
  </nav>

  <div class="modal-overlay" id="cashierModal" onclick="closeModal(event)">
    <div class="modal-content">
      <h3 style="margin-bottom:14px; font-weight:800;">Касса Stars</h3>
      <input type="number" id="depAmount" value="50" style="width:100%; background:rgba(0,0,0,0.3); border:1px solid var(--border-color); border-radius:12px; padding:12px; color:#fff; font-size:16px; margin-bottom:12px;">
      <button class="btn-action btn-bet-execute" style="background:var(--accent-gold-gradient); color:#000;" onclick="makeDeposit()">Пополнить через Telegram Stars</button>
    </div>
  </div>

  <div class="modal-overlay" id="adminModal" onclick="closeModal(event)">
    <div class="modal-content" style="border-top-color: var(--accent-cyan);">
      <h3 style="color:var(--accent-cyan); margin-bottom:12px;">👤 Модерация баланса</h3>
      <input type="number" id="adminInput" value="100" style="width:100%; background:rgba(0,0,0,0.3); border:1px solid var(--border-color); border-radius:12px; padding:12px; color:#fff; font-size:16px; margin-bottom:12px;">
      <button class="btn-action" style="background:var(--accent-cyan); color:#000;" onclick="adminGiveStars()">Выдать баланс</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.expand(); tg.ready(); }

    const BACKEND_URL = 'https://tma-backend-production-b842.up.railway.app';
    const ADMIN_TELEGRAM_ID = '944873428';

    function getSafeUser() {
      const user = tg?.initDataUnsafe?.user;
      if (user && user.id) return user;
      return { id: ADMIN_TELEGRAM_ID, username: 'mittere', first_name: 'Admin' };
    }

    let balance = 0;
    let currentBet = 10;
    let isBetPlaced = false;
    let isCashedOut = false;
    
    let globalMult = 1.00;
    let gamePhase = 'waiting'; 
    let waitTimer = 5;
    let mainInterval = null;
    let currentCrashPoint = 1.00;

    const botPool = [
      {name: 'xedoxov #dunux', avatar: '🦊'},
      {name: 'kitkis', avatar: '🐱'},
      {name: 'Mr. jokr', avatar: '🃏'},
      {name: 'Даня', avatar: '⚡'},
      {name: 'важный', avatar: '👑'},
      {name: 'Ionu', avatar: '💎'},
      {name: 'penny', avatar: '🚀'},
      {name: 'Fenek 🇲🇦', avatar: '🦊'}
    ];
    let activeParticipants = [];

    async function init() {
      const user = getSafeUser();
      try {
        const res = await fetch(`${BACKEND_URL}/api/user/${user.id}`);
        if(res.ok) {
          const data = await res.json();
          balance = data.balance || 0;
          updateBalance();
        }
      } catch(e){}
      startEngineLoop();
    }

    function updateBalance() {
      document.getElementById('balanceText').innerText = balance;
    }

    function switchView(view) {
      document.getElementById('viewHome').style.display = view === 'home' ? 'flex' : 'none';
      document.getElementById('viewRocket').style.display = view === 'rocket' ? 'flex' : 'none';
    }

    function changeBet(boxId, amount) {
      if (amount === 'max') currentBet = balance;
      else currentBet = Math.max(1, currentBet + amount);
      document.getElementById('betText1').innerText = currentBet;
      document.getElementById('usdText1').innerText = (currentBet * 0.015).toFixed(2);
    }

    function startEngineLoop() {
      runWaitingPhase();
    }

    function runWaitingPhase() {
      gamePhase = 'waiting';
      waitTimer = 5;
      globalMult = 1.00;
      isCashedOut = false;
      document.getElementById('rocketDisplay').innerText = "5";
      document.getElementById('participantsStatus').innerText = "⌛ Ожидание";

      activeParticipants = botPool.sort(() => 0.5 - Math.random()).slice(0, 5).map(b => ({
        name: b.name,
        avatar: b.avatar,
        bet: Math.floor(Math.random() * 80) + 10,
        cashed: false,
        cashMultiplier: 0
      }));

      if (isBetPlaced) {
        activeParticipants.unshift({
          name: getSafeUser().first_name || 'Вы',
          avatar: '⭐',
          bet: currentBet,
          cashed: false,
          cashMultiplier: 0,
          isUser: true
        });
      }

      renderParticipants();

      const timerInterval = setInterval(() => {
        waitTimer--;
        if (waitTimer > 0) {
          document.getElementById('rocketDisplay').innerText = waitTimer;
        } else {
          clearInterval(timerInterval);
          document.getElementById('rocketDisplay').innerText = "GO";
          setTimeout(() => startFlyingPhase(), 500);
        }
      }, 1000);
    }

    function startFlyingPhase() {
      gamePhase = 'flying';
      document.getElementById('participantsStatus').innerText = "🎮 Игра окончена";

      const r = Math.random();
      if (r < 0.04) {
        currentCrashPoint = 1.00;
      } else {
        const playerOut = !isBetPlaced || isCashedOut;
        if (playerOut && Math.random() < 0.4) {
          currentCrashPoint = parseFloat((120 + Math.random() * 880).toFixed(2)); 
        } else {
          currentCrashPoint = Math.max(1.05, parseFloat((0.95 / (1 - Math.random() * 0.95)).toFixed(2)));
          if (currentCrashPoint > 40) currentCrashPoint = parseFloat((2 + Math.random() * 25).toFixed(2));
        }
      }

      mainInterval = setInterval(() => {
        globalMult += 0.04;
        document.getElementById('rocketDisplay').innerText = globalMult.toFixed(2) + 'x';

        activeParticipants.forEach(p => {
          if (!p.cashed && globalMult >= (1.1 + Math.random() * 3.5)) {
            p.cashed = true;
            p.cashMultiplier = parseFloat(globalMult.toFixed(2));
          }
        });

        if (isBetPlaced && !isCashedOut && document.getElementById('autoToggle1').checked && globalMult >= 2.0) {
          executeCashOut();
        }

        renderParticipants();

        if (globalMult >= currentCrashPoint) {
          triggerCrash();
        }
      }, 80);
    }

    function triggerCrash() {
      clearInterval(mainInterval);
      gamePhase = 'crashed';
      document.getElementById('rocketDisplay').innerText = "💥 CRASH";

      activeParticipants.forEach(p => {
        if (!p.cashed) {
          p.cashed = true;
          p.cashMultiplier = 0; 
        }
      });
      renderParticipants();

      if (isBetPlaced && !isCashedOut) {
        isBetPlaced = false;
        document.getElementById('btnBet1').innerText = "🚀 Сделать ставку";
        document.getElementById('btnBet1').style.background = "var(--btn-green-gradient)";
      }

      addHistoryPill(globalMult.toFixed(2) + 'x');

      setTimeout(() => {
        runWaitingPhase();
      }, 3000);
    }

    function handleRocketBet() {
      const btn = document.getElementById('btnBet1');

      if (gamePhase === 'waiting') {
        if (!isBetPlaced) {
          if (currentBet > balance) { alert("Недостаточно средств"); return; }
          balance -= currentBet;
          updateBalance();
          isBetPlaced = true;
          btn.innerText = "Отменить ставку";
          btn.style.background = "#ff4757";

          activeParticipants.unshift({
            name: getSafeUser().first_name || 'Вы',
            avatar: '⭐',
            bet: currentBet,
            cashed: false,
            cashMultiplier: 0,
            isUser: true
          });
          renderParticipants();
        } else {
          balance += currentBet;
          updateBalance();
          isBetPlaced = false;
          btn.innerText = "🚀 Сделать ставку";
          btn.style.background = "var(--btn-green-gradient)";
          activeParticipants = activeParticipants.filter(p => !p.isUser);
          renderParticipants();
        }
      } else if (gamePhase === 'flying') {
        if (isBetPlaced && !isCashedOut) {
          executeCashOut();
        }
      }
    }

    function executeCashOut() {
      isCashedOut = true;
      const winAmount = Math.floor(currentBet * globalMult);
      balance += winAmount;
      updateBalance();

      const btn = document.getElementById('btnBet1');
      btn.innerText = `Забрано (+${winAmount} ⭐)`;
      btn.style.background = "#2ed573";

      const userP = activeParticipants.find(p => p.isUser);
      if (userP) {
        userP.cashed = true;
        userP.cashMultiplier = parseFloat(globalMult.toFixed(2));
      }
      renderParticipants();
      isBetPlaced = false;
    }

    function renderParticipants() {
      const list = document.getElementById('participantsList');
      list.innerHTML = activeParticipants.map(p => `
        <div class="participant-row">
          <div class="participant-user">
            <div class="participant-avatar">${p.avatar}</div>
            <span style="${p.isUser ? 'color: var(--accent-cyan);' : ''}">${p.name}</span>
          </div>
          <div style="display:flex; align-items:center; gap:12px;">
            <span>⭐ ${p.bet}</span>
            <span class="participant-win ${p.cashed && p.cashMultiplier > 0 ? 'success' : ''}">
              ${p.cashed ? (p.cashMultiplier > 0 ? '+' + Math.floor(p.bet * p.cashMultiplier) + ' ⭐ (' + p.cashMultiplier + 'x)' : 'Сгорел') : '⏳'}
            </span>
          </div>
        </div>
      `).join('');
    }

    function addHistoryPill(text) {
      const strip = document.getElementById('historyStrip');
      const pill = document.createElement('div');
      pill.className = 'history-pill';
      pill.innerText = text;
      strip.prepend(pill);
      if (strip.children.length > 10) strip.lastChild.remove();
    }

    function openCashier() { document.getElementById('cashierModal').style.display = 'flex'; }
    function openAdminModal() { document.getElementById('adminModal').style.display = 'flex'; }
    function closeModal(e) { if(e.target.classList.contains('modal-overlay')) e.target.style.display = 'none'; }

    async function adminGiveStars() {
      const amt = parseInt(document.getElementById('adminInput').value) || 0;
      const user = getSafeUser();
      const res = await fetch(`${BACKEND_URL}/api/admin/give-stars`, {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ adminId: user.id, targetUserId: user.id, amount: amt })
      });
      const data = await res.json();
      if(data.success) { balance = data.newBalance; updateBalance(); alert('Баланс пополнен!'); document.getElementById('adminModal').style.display='none'; }
    }

    async function makeDeposit() {
      const amt = parseInt(document.getElementById('depAmount').value) || 50;
      const user = getSafeUser();
      const res = await fetch(`${BACKEND_URL}/api/create-stars-invoice`, {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ userId: user.id, starsAmount: amt })
      });
      const data = await res.json();
      if(data.invoiceLink && tg?.openInvoice) {
        tg.openInvoice(data.invoiceLink, (status) => {
          if(status === 'paid') { balance += amt; updateBalance(); document.getElementById('cashierModal').style.display='none'; }
        });
      }
    }

    window.addEventListener('load', init);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GaoGambling Casino</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-dark: #07090e;
      --card-bg: #121824;
      --card-hover: #1a2233;
      --accent-cyan: #00f2fe;
      --accent-gold: #ffb703;
      --accent-gold-gradient: linear-gradient(135deg, #ffd166, #ff9e00);
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --border-color: rgba(255, 255, 255, 0.08);
      --nav-bg: rgba(14, 18, 26, 0.95);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 80px; /* Место под нижний таб-бар */
    }

    /* ШАПКА */
    .header {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: var(--bg-dark);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-logo {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      color: #00f2fe;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-connect {
      background: #0098ea;
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .balance-pill {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 800;
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    /* ОСНОВНОЙ КОНТЕЙНЕР */
    .main-container {
      width: 100%;
      max-width: 480px;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* БАННЕР АКЦИИ */
    .promo-banner {
      width: 100%;
      background: linear-gradient(135deg, #ff9e00 0%, #ff5100 100%);
      border-radius: 20px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 8px 24px rgba(255, 110, 0, 0.25);
      cursor: pointer;
    }

    .promo-title {
      font-size: 18px;
      font-weight: 900;
      color: #fff;
      margin-bottom: 4px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }

    .promo-sub {
      font-size: 13px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.9);
    }

    .section-title {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* СЕТКА ИГР */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .game-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.2s;
    }

    .game-card:active {
      transform: scale(0.96);
    }

    .game-thumb {
      width: 100%;
      height: 75px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      position: relative;
      overflow: hidden;
    }

    .game-name {
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      color: var(--text-main);
    }

    /* ИГРОВОЙ ЭКРАН РАКЕТКИ */
    .game-view {
      display: none;
      flex-direction: column;
      gap: 14px;
      width: 100%;
    }

    .back-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      color: var(--text-muted);
      margin-bottom: -4px;
    }

    .rocket-screen {
      width: 100%;
      height: 210px;
      background: radial-gradient(circle at center, #1b2238 0%, #0a0e17 100%);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 40px rgba(0,0,0,0.8);
    }

    .rocket-mult {
      font-size: 46px;
      font-weight: 900;
      color: var(--accent-gold);
      text-shadow: 0 0 20px rgba(255, 183, 3, 0.4);
      z-index: 2;
    }

    .rocket-ship {
      font-size: 36px;
      position: absolute;
      bottom: 25px;
      left: 25px;
      transition: transform 0.1s linear;
      z-index: 2;
    }

    /* Лента прошлых множителей */
    .history-strip {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .history-strip::-webkit-scrollbar { display: none; }

    .history-pill {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 4px 10px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    /* ДВЕ ПАНЕЛИ СТАВОК */
    .bets-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .bet-box {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .bet-controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .bet-input-wrap {
      display: flex;
      align-items: center;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 6px 10px;
      width: 130px;
    }

    .bet-input {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      width: 100%;
      outline: none;
      text-align: right;
    }

    .quick-btns {
      display: flex;
      gap: 4px;
    }

    .q-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 6px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .auto-cashout-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
      padding-top: 8px;
    }

    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255,255,255,0.1);
      transition: .2s; border-radius: 20px;
    }
    .slider:before {
      position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px;
      background-color: white; transition: .2s; border-radius: 50%;
    }
    input:checked + .slider { background-color: var(--accent-cyan); }
    input:checked + .slider:before { transform: translateX(16px); }

    .btn-bet-execute {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      background: var(--accent-gold-gradient);
      color: #000;
      box-shadow: 0 4px 16px rgba(255, 183, 3, 0.3);
      transition: transform 0.1s;
    }
    .btn-bet-execute:active { transform: scale(0.98); }

    /* НИЖНИЙ ТАБ-БАР */
    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--nav-bg);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      padding: 10px 0 20px 0;
      z-index: 1000;
      max-width: 480px;
      margin: 0 auto;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      background: transparent;
      border: none;
      transition: color 0.2s;
    }

    .nav-item.active {
      color: var(--accent-cyan);
    }

    .nav-icon {
      font-size: 20px;
    }

    /* МОДАЛКИ (Касса и Админка) */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8); backdrop-filter: blur(8px);
      display: none; align-items: flex-end; justify-content: center; z-index: 2000;
    }
    .modal-content {
      width: 100%; max-width: 480px; background: #141925;
      border-top-left-radius: 28px; border-top-right-radius: 28px;
      padding: 24px 20px 32px 20px; border-top: 1px solid var(--border-color);
    }
  </style>
</head>
<body>

  <!-- ШАПКА -->
  <header class="header">
    <div class="brand-logo">🔥 Random Games</div>
    <div class="header-right">
      <button class="btn-connect" onclick="alert('Кошелек подключен!')">Connect</button>
      <div class="balance-pill" onclick="openCashier('deposit')">
        ⭐ <span id="balanceText">0</span>
      </div>
    </div>
  </header>

  <!-- ГЛАВНОЕ МЕНЮ -->
  <div class="main-container" id="viewHome">
    <!-- Баннер -->
    <div class="promo-banner" onclick="openCashier('deposit')">
      <div>
        <div class="promo-title">Бесплатный кейс</div>
        <div class="promo-sub">за подписку на канал</div>
      </div>
      <div style="font-size: 40px;">🎁</div>
    </div>

    <!-- Лучшие игры -->
    <div>
      <div class="section-title">🔥 Лучшие игры</div>
      <div class="games-grid">
        <div class="game-card" onclick="alert('Апгрейдер в разработке')">
          <div class="game-thumb" style="background: linear-gradient(135deg, #2b3548, #1a2233);">💎</div>
          <div class="game-name">Апгрейдер</div>
        </div>
        <div class="game-card" onclick="switchView('rocket')">
          <div class="game-thumb" style="background: linear-gradient(135deg, #1f293d, #0f1624); border: 1px solid rgba(0,242,254,0.3);">🚀</div>
          <div class="game-name">Ракетка</div>
        </div>
        <div class="game-card" onclick="alert('PVP в разработке')">
          <div class="game-thumb" style="background: linear-gradient(135deg, #1b3a2b, #0f2219);">⚔️</div>
          <div class="game-name">PVP</div>
        </div>
      </div>
    </div>

    <!-- Быстрые игры -->
    <div>
      <div class="section-title">⚡ Быстрые игры</div>
      <div class="games-grid">
        <div class="game-card" onclick="alert('Кейсы скоро')">
          <div class="game-thumb">📦</div>
          <div class="game-name">Кейсы</div>
        </div>
        <div class="game-card" onclick="alert('Мины скоро')">
          <div class="game-thumb">⛏️</div>
          <div class="game-name">Мины</div>
        </div>
        <div class="game-card" onclick="alert('Башня скоро')">
          <div class="game-thumb">🗼</div>
          <div class="game-name">Башня</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ВИД ИГРЫ: РАКЕТКА (с 2 ставками, автовыводом и RTP 95%) -->
  <div class="main-container game-view" id="viewRocket">
    <div class="back-bar" onclick="switchView('home')">← Назад в меню</div>

    <div class="rocket-screen" id="rocketScreen">
      <div class="rocket-mult" id="rocketDisplay">1.00x</div>
      <div class="rocket-ship" id="rocketShip">🚀</div>
    </div>

    <div class="history-strip" id="historyStrip">
      <div class="history-pill" style="color:var(--accent-cyan)">1.22x</div>
      <div class="history-pill" style="color:var(--text-muted)">1.47x</div>
      <div class="history-pill" style="color:var(--accent-gold)">13.22x</div>
    </div>

    <div class="bets-container">
      <!-- СТАВКА 1 -->
      <div class="bet-box">
        <div class="bet-controls-row">
          <div class="quick-btns">
            <button class="q-btn" onclick="adjustBet(1, -10)">-10</button>
            <button class="q-btn" onclick="adjustBet(1, 50)">+50</button>
            <button class="q-btn" onclick="adjustBet(1, 'max')">MAX</button>
          </div>
          <div class="bet-input-wrap">
            <input type="number" id="betInput1" class="bet-input" value="10" min="1">
            <span style="font-weight:800; color:var(--accent-gold);">⭐</span>
          </div>
        </div>
        <div class="auto-cashout-row">
          <span>Автовывод (множитель)</span>
          <div style="display:flex; align-items:center; gap:8px;">
            <input type="number" id="autoVal1" value="2.00" step="0.1" style="width:50px; background:transparent; border:none; color:#fff; font-weight:700; text-align:right; outline:none;">
            <label class="toggle-switch">
              <input type="checkbox" id="autoToggle1">
              <span class="slider"></span>
            </label>
          </div>
        </div>
        <button class="btn-action btn-bet-execute" id="btnBet1" onclick="handleRocketBet(1)">Сделать ставку</button>
      </div>

      <!-- СТАВКА 2 -->
      <div class="bet-box">
        <div class="bet-controls-row">
          <div class="quick-btns">
            <button class="q-btn" onclick="adjustBet(2, -10)">-10</button>
            <button class="q-btn" onclick="adjustBet(2, 50)">+50</button>
            <button class="q-btn" onclick="adjustBet(2, 'max')">MAX</button>
          </div>
          <div class="bet-input-wrap">
            <input type="number" id="betInput2" class="bet-input" value="10" min="1">
            <span style="font-weight:800; color:var(--accent-gold);">⭐</span>
          </div>
        </div>
        <div class="auto-cashout-row">
          <span>Автовывод (множитель)</span>
          <div style="display:flex; align-items:center; gap:8px;">
            <input type="number" id="autoVal2" value="2.00" step="0.1" style="width:50px; background:transparent; border:none; color:#fff; font-weight:700; text-align:right; outline:none;">
            <label class="toggle-switch">
              <input type="checkbox" id="autoToggle2">
              <span class="slider"></span>
            </label>
          </div>
        </div>
        <button class="btn-action btn-bet-execute" id="btnBet2" onclick="handleRocketBet(2)">Сделать ставку</button>
      </div>
    </div>
  </div>

  <!-- НИЖНИЙ ТАБ-БАР -->
  <nav class="nav-bar">
    <button class="nav-item active" onclick="switchView('home')">
      <span class="nav-icon">🏠</span>
      Главная
    </button>
    <button class="nav-item" onclick="openCashier('deposit')">
      <span class="nav-icon">📦</span>
      Кейсы
    </button>
    <button class="nav-item" onclick="openCashier('withdraw')">
      <span class="nav-icon">📊</span>
      Лидеры
    </button>
    <button class="nav-item" onclick="openAdminModal()">
      <span class="nav-icon">👤</span>
      Профиль
    </button>
  </nav>

  <!-- МОДАЛКА КАССЫ -->
  <div class="modal-overlay" id="cashierModal" onclick="closeModal(event)">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h3 style="font-size:18px; font-weight:800;">Касса Stars</h3>
        <span style="font-size:24px; color:var(--text-muted); cursor:pointer;" onclick="document.getElementById('cashierModal').style.display='none'">&times;</span>
      </div>
      <div style="display:flex; gap:8px; margin-bottom:16px;">
        <button class="btn-action" style="background:rgba(255,255,255,0.08); color:#fff;" onclick="openCashier('deposit')">Пополнить</button>
        <button class="btn-action" style="background:rgba(255,255,255,0.08); color:#fff;" onclick="openCashier('withdraw')">Вывести</button>
      </div>
      <div id="depSection">
        <input type="number" id="depAmount" class="bet-input-field" value="50" style="margin-bottom:12px; text-align:left;">
        <button class="btn-action btn-bet-execute" onclick="makeDeposit()">Купить Telegram Stars</button>
      </div>
    </div>
  </div>

  <!-- МОДАЛКА АДМИНКИ -->
  <div class="modal-overlay" id="adminModal" onclick="closeModal(event)">
    <div class="modal-content" style="border-top-color: var(--accent-cyan);">
      <h3 style="color:var(--accent-cyan); margin-bottom:12px;">🛡️ Панель модератора</h3>
      <input type="number" id="adminInput" class="bet-input-field" value="100" style="margin-bottom:12px; text-align:left;">
      <button class="btn-action" style="background:var(--accent-cyan); color:#000;" onclick="adminGiveStars()">Выдать баланс</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.expand(); tg.ready(); }

    const BACKEND_URL = 'https://tma-backend-production-b842.up.railway.app';
    const ADMIN_TELEGRAM_ID = '944873428';

    function getSafeUser() {
      const user = tg?.initDataUnsafe?.user;
      if (user && user.id) return user;
      return { id: ADMIN_TELEGRAM_ID, username: 'mittere', first_name: 'Admin' };
    }

    let balance = 0;
    let totalDeposited = 0;
    let totalWagered = 0;

    // Инициализация игры Ракетка (2 ставки независимо друг от друга)
    let rocketState = {
      1: { active: false, bet: 0, autoCash: 0, autoOn: false },
      2: { active: false, bet: 0, autoCash: 0, autoOn: false }
    };
    let globalMult = 1.00;
    let isRunning = false;
    let rocketTimer = null;
    let currentCrashPoint = 1.00;

    async function init() {
      const user = getSafeUser();
      try {
        const res = await fetch(`${BACKEND_URL}/api/user/${user.id}`);
        if(res.ok) {
          const data = await res.json();
          balance = data.balance || 0;
          totalDeposited = data.totalDeposited || 0;
          totalWagered = data.totalWagered || 0;
          updateBalance();
        }
      } catch(e){}
    }

    function updateBalance() {
      document.getElementById('balanceText').innerText = balance;
    }

    function switchView(view) {
      document.getElementById('viewHome').style.display = view === 'home' ? 'flex' : 'none';
      document.getElementById('viewRocket').style.display = view === 'rocket' ? 'flex' : 'none';
    }

    function adjustBet(boxId, amount) {
      const input = document.getElementById(`betInput${boxId}`);
      let val = parseInt(input.value) || 0;
      if (amount === 'max') val = balance;
      else val += amount;
      input.value = Math.max(1, val);
    }

    // ЛОГИКА РАКЕТКИ С RTP 95%
    function handleRocketBet(boxId) {
      const state = rocketState[boxId];
      const btn = document.getElementById(`btnBet${boxId}`);
      const inputVal = parseInt(document.getElementById(`betInput${boxId}`).value) || 0;
      const autoToggle = document.getElementById(`autoToggle${boxId}`).checked;
      const autoVal = parseFloat(document.getElementById(`autoVal${boxId}`).value) || 2.0;

      if (!state.active) {
        if (inputVal < 1 || inputVal > balance) { alert("Неверная ставка"); return; }
        balance -= inputVal;
        totalWagered += inputVal;
        updateBalance();

        state.bet = inputVal;
        state.active = true;
        state.autoOn = autoToggle;
        state.autoCash = autoVal;

        btn.innerText = "Забрать";
        btn.style.background = "#ff4757";

        if (!isRunning) startGlobalFlight();
      } else {
        // Забрать выигрыш вручную
        const win = Math.floor(state.bet * globalMult);
        balance += win;
        updateBalance();
        resetBox(boxId);
      }
    }

    function startGlobalFlight() {
      isRunning = true;
      globalMult = 1.00;
      // RTP 95%: формульный расчет краша с математическим ожиданием 0.95
      // В 5% случаев крах сразу на 1.00x, иначе распределение
      const r = Math.random();
      if (r < 0.05) {
        currentCrashPoint = 1.00;
      } else {
        currentCrashPoint = Math.max(1.01, parseFloat((0.95 / (1 - Math.random() * 0.95)).toFixed(2)));
        // Ограничим разумным пределом для динамики
        if (currentCrashPoint > 25) currentCrashPoint = parseFloat((5 + Math.random() * 15).toFixed(2));
      }

      let posX = 25, posY = 25;

      rocketTimer = setInterval(() => {
        globalMult += 0.03;
        posX += 1.5; posY += 1.2;
        document.getElementById('rocketDisplay').innerText = globalMult.toFixed(2) + 'x';
        document.getElementById('rocketShip').style.transform = `translate(${Math.min(posX, 180)}px, -${Math.min(posY, 100)}px)`;

        // Проверка автовывода для обоих боксов
        [1, 2].forEach(id => {
          if (rocketState[id].active && rocketState[id].autoOn && globalMult >= rocketState[id].autoCash) {
            handleRocketBet(id); // Автоматический кэшаут
          }
        });

        if (globalMult >= currentCrashPoint) {
          endFlight(false);
        }
      }, 80);
    }

    function endFlight(crashed) {
      clearInterval(rocketTimer);
      isRunning = false;
      document.getElementById('rocketDisplay').innerText = crashed ? "💥 CRASH" : globalMult.toFixed(2) + "x";
      document.getElementById('rocketShip').style.transform = 'translate(0px, 0px)';

      // Сброс активных не успевших забрать
      [1, 2].forEach(id => {
        if (rocketState[id].active) {
          resetBox(id);
        }
      });

      setTimeout(() => {
        if(!isRunning) document.getElementById('rocketDisplay').innerText = "1.00x";
      }, 2000);
    }

    function resetBox(boxId) {
      rocketState[boxId].active = false;
      const btn = document.getElementById(`btnBet${boxId}`);
      btn.innerText = "Сделать ставку";
      btn.style.background = "var(--accent-gold-gradient)";
    }

    // Касса и админка
    function openCashier(tab) { document.getElementById('cashierModal').style.display = 'flex'; }
    function openAdminModal() { document.getElementById('adminModal').style.display = 'flex'; }
    function closeModal(e) { if(e.target.classList.contains('modal-overlay')) e.target.style.display = 'none'; }

    async function adminGiveStars() {
      const amt = parseInt(document.getElementById('adminInput').value) || 0;
      const user = getSafeUser();
      const res = await fetch(`${BACKEND_URL}/api/admin/give-stars`, {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ adminId: user.id, targetUserId: user.id, amount: amt })
      });
      const data = await res.json();
      if(data.success) { balance = data.newBalance; updateBalance(); alert('Успешно выдано!'); document.getElementById('adminModal').style.display='none'; }
    }

    async function makeDeposit() {
      const amt = parseInt(document.getElementById('depAmount').value) || 50;
      const user = getSafeUser();
      const res = await fetch(`${BACKEND_URL}/api/create-stars-invoice`, {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ userId: user.id, starsAmount: amt })
      });
      const data = await res.json();
      if(data.invoiceLink && tg?.openInvoice) {
        tg.openInvoice(data.invoiceLink, (status) => {
          if(status === 'paid') { balance += amt; updateBalance(); document.getElementById('cashierModal').style.display='none'; }
        });
      }
    }

    window.addEventListener('load', init);
  </script>
</body>
</html>

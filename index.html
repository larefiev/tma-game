<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Random Games Casino</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-dark: #07090e;
      --card-bg: #121824;
      --accent-cyan: #00f2fe;
      --accent-gold: #ffb703;
      --accent-red: #ff2d55;
      --accent-gold-gradient: linear-gradient(135deg, #ffd166, #ff9e00);
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --border-color: rgba(255, 255, 255, 0.08);
      --nav-bg: rgba(14, 18, 26, 0.95);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 90px;
    }

    .header {
      width: 100%; max-width: 480px; display: flex; justify-content: space-between; align-items: center;
      padding: 12px 16px; background: var(--bg-dark); position: sticky; top: 0; z-index: 100;
    }

    .brand-logo {
      background: rgba(255, 255, 255, 0.06); border: 1px solid var(--border-color);
      padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 700; color: #00f2fe;
    }

    .header-right { display: flex; align-items: center; gap: 8px; }
    .btn-connect { background: #0098ea; color: #fff; border: none; padding: 6px 14px; border-radius: 16px; font-size: 13px; font-weight: 700; cursor: pointer; }

    .balance-pill {
      background: var(--card-bg); border: 1px solid var(--border-color); padding: 6px 14px;
      border-radius: 16px; font-size: 13px; font-weight: 800; color: var(--accent-gold); cursor: pointer;
    }

    .main-container {
      width: 100%; max-width: 480px; padding: 0 16px; display: flex; flex-direction: column; gap: 16px;
    }

    .promo-banner {
      width: 100%; background: linear-gradient(135deg, #ff9e00 0%, #ff5100 100%);
      border-radius: 20px; padding: 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer;
    }

    .section-title { font-size: 16px; font-weight: 800; margin-bottom: 10px; }

    .games-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .game-card {
      background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px;
      padding: 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 10px; cursor: pointer;
    }
    .game-thumb { width: 100%; height: 75px; background: rgba(0, 0, 0, 0.2); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 32px; }
    .game-name { font-size: 12px; font-weight: 700; text-align: center; }

    .game-view { display: none; flex-direction: column; gap: 12px; width: 100%; }
    .nav-back-row { display: flex; align-items: center; justify-content: space-between; }
    .btn-back { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-muted); padding: 6px 14px; border-radius: 16px; font-size: 13px; font-weight: 700; cursor: pointer; }

    .rocket-screen {
      width: 100%; height: 240px; background: radial-gradient(circle at center, #181d2d 0%, #07090e 100%);
      border: 1px solid var(--border-color); border-radius: 24px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; position: relative; overflow: hidden;
    }

    .rocket-mult { font-size: 52px; font-weight: 900; color: var(--accent-red); text-shadow: 0 0 25px rgba(255, 45, 85, 0.4); z-index: 2; }
    .rocket-status-sub { font-size: 13px; color: var(--text-muted); font-weight: 700; margin-top: -8px; z-index: 2; }

    .history-strip { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0; scrollbar-width: none; }
    .history-strip::-webkit-scrollbar { display: none; }
    .history-pill { background: var(--card-bg); border: 1px solid var(--border-color); padding: 5px 12px; border-radius: 14px; font-size: 12px; font-weight: 800; white-space: nowrap; }

    .bet-box { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
    .bet-label { text-align: center; font-size: 13px; color: var(--text-muted); font-weight: 600; }
    .bet-display-row { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 26px; font-weight: 900; color: #fff; }
    .bet-sub-currency { font-size: 12px; color: var(--text-muted); text-align: center; margin-top: -8px; }

    .quick-btns-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .q-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color); color: var(--text-main); padding: 12px; border-radius: 16px; font-size: 14px; font-weight: 700; cursor: pointer; text-align: center; }

    .auto-cashout-row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--text-muted); border-top: 1px solid var(--border-color); padding-top: 12px; }
    .toggle-switch { position: relative; display: inline-block; width: 44px; height: 24px; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(255,255,255,0.1); transition: .2s; border-radius: 24px; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .2s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--accent-cyan); }
    input:checked + .slider:before { transform: translateX(20px); }

    .btn-bet-execute { width: 100%; padding: 16px; border: none; border-radius: 16px; font-size: 16px; font-weight: 800; cursor: pointer; background: var(--accent-gold-gradient); color: #000; box-shadow: 0 4px 20px rgba(255, 183, 3, 0.35); }

    .nav-bar {
      position: fixed; bottom: 0; left: 0; right: 0; background: var(--nav-bg); backdrop-filter: blur(20px);
      border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; padding: 12px 0 24px 0; z-index: 1000; max-width: 480px; margin: 0 auto;
      border-top-left-radius: 28px; border-top-right-radius: 28px;
    }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-muted); font-size: 11px; font-weight: 700; cursor: pointer; background: transparent; border: none; }
    .nav-item.active { color: var(--accent-cyan); }
    .nav-icon { font-size: 20px; }

    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); display: none; align-items: flex-end; justify-content: center; z-index: 2000; }
    .modal-content { width: 100%; max-width: 480px; background: #141925; border-top-left-radius: 28px; border-top-right-radius: 28px; padding: 24px 20px 36px 20px; border-top: 1px solid var(--border-color); }
  </style>
</head>
<body>

  <header class="header">
    <div class="brand-logo">🎮 Random Games</div>
    <div class="header-right">
      <button class="btn-connect" onclick="alert('Кошелек подключен!')">Connect</button>
      <div class="balance-pill" onclick="openCashier()">⭐ <span id="balanceText">0</span> Stars</div>
    </div>
  </header>

  <div class="main-container" id="viewHome">
    <div class="promo-banner" onclick="openCashier()">
      <div>
        <div style="font-size:18px; font-weight:900; color:#fff;">Бесплатный кейс</div>
        <div style="font-size:13px; font-weight:700; color:rgba(255,255,255,0.9);">за подписку на канал</div>
      </div>
      <div style="font-size: 40px;">🎁</div>
    </div>

    <div>
      <div class="section-title">🔥 Лучшие игры</div>
      <div class="games-grid">
        <div class="game-card" onclick="alert('Скоро')"><div class="game-thumb">💎</div><div class="game-name">Апгрейдер</div></div>
        <div class="game-card" onclick="switchView('rocket')">
          <div class="game-thumb" style="border: 1px solid rgba(255,45,85,0.4); background: radial-gradient(circle, #1f1018 0%, #121824 100%);">🚀</div>
          <div class="game-name">Ракетка</div>
        </div>
        <div class="game-card" onclick="alert('Скоро')"><div class="game-thumb">⚔️</div><div class="game-name">PVP</div></div>
      </div>
    </div>
  </div>

  <!-- ИГРА РАКЕТКА С ТАЙМЕРОМ, БОТАМИ И УМНЫМ КРАШЕМ -->
  <div class="main-container game-view" id="viewRocket">
    <div class="nav-back-row">
      <button class="btn-back" onclick="switchView('home')">❮ Назад</button>
      <span style="font-weight:800; font-size:15px; color:var(--accent-red);">🚀 Ракетка</span>
      <div style="width: 60px;"></div>
    </div>

    <div class="rocket-screen">
      <div class="rocket-mult" id="rocketDisplay">1.00x</div>
      <div class="rocket-status-sub" id="rocketSubText">Ожидание ставок...</div>
    </div>

    <div class="history-strip" id="historyStrip">
      <div class="history-pill" style="color:var(--accent-cyan)">1.15x</div>
      <div class="history-pill" style="color:var(--accent-gold)">5.27x</div>
      <div class="history-pill" style="color:#2ed573">2.08x</div>
    </div>

    <!-- СТАВКА 1 -->
    <div class="bet-box">
      <div class="bet-label">Ставка #1 (Боты ставят автоматически)</div>
      <div class="bet-display-row"><span>⭐</span><span id="betText1">10</span></div>
      <div class="quick-btns-grid">
        <button class="q-btn" onclick="changeBet(1, -10)">-10</button>
        <button class="q-btn" onclick="changeBet(1, 50)">+50</button>
        <button class="q-btn" onclick="changeBet(1, 'max')">MAX</button>
      </div>
      <button class="btn-action btn-bet-execute" id="btnBet1" onclick="handleRocketBet(1)">Сделать ставку</button>
    </div>

    <!-- СТАВКА 2 -->
    <div class="bet-box">
      <div class="bet-label">Ставка #2</div>
      <div class="bet-display-row"><span>⭐</span><span id="betText2">10</span></div>
      <div class="quick-btns-grid">
        <button class="q-btn" onclick="changeBet(2, -10)">-10</button>
        <button class="q-btn" onclick="changeBet(2, 50)">+50</button>
        <button class="q-btn" onclick="changeBet(2, 'max')">MAX</button>
      </div>
      <button class="btn-action btn-bet-execute" id="btnBet2" onclick="handleRocketBet(2)">Сделать ставку #2</button>
    </div>
  </div>

  <nav class="nav-bar">
    <button class="nav-item active" onclick="switchView('home')"><span class="nav-icon">🏠</span>Главная</button>
    <button class="nav-item" onclick="openCashier()"><span class="nav-icon">📦</span>Кейсы</button>
    <button class="nav-item" onclick="openCashier()"><span class="nav-icon">📊</span>Лидеры</button>
    <button class="nav-item" onclick="openAdminModal()"><span class="nav-icon">👤</span>Профиль</button>
  </nav>

  <div class="modal-overlay" id="cashierModal" onclick="closeModal(event)">
    <div class="modal-content">
      <h3 style="margin-bottom:14px; font-weight:800;">Касса Stars</h3>
      <input type="number" id="depAmount" class="bet-input-field" value="50" style="width:100%; background:rgba(0,0,0,0.3); border:1px solid var(--border-color); border-radius:12px; padding:12px; color:#fff; font-size:16px; margin-bottom:12px;">
      <button class="btn-action btn-bet-execute" onclick="makeDeposit()">Пополнить через Telegram Stars</button>
    </div>
  </div>

  <div class="modal-overlay" id="adminModal" onclick="closeModal(event)">
    <div class="modal-content" style="border-top-color: var(--accent-cyan);">
      <h3 style="color:var(--accent-cyan); margin-bottom:12px;">👤 Модерация баланса</h3>
      <input type="number" id="adminInput" value="100" style="width:100%; background:rgba(0,0,0,0.3); border:1px solid var(--border-color); border-radius:12px; padding:12px; color:#fff; font-size:16px; margin-bottom:12px;">
      <button class="btn-action" style="background:var(--accent-cyan); color:#000;" onclick="adminGiveStars()">Выдать баланс</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.expand(); tg.ready(); }

    const BACKEND_URL = 'https://tma-backend-production-b842.up.railway.app';
    const ADMIN_TELEGRAM_ID = '944873428';

    function getSafeUser() {
      const user = tg?.initDataUnsafe?.user;
      if (user && user.id) return user;
      return { id: ADMIN_TELEGRAM_ID, username: 'mittere', first_name: 'Admin' };
    }

    let balance = 0;
    let bets = { 1: 10, 2: 10 };
    let rocketState = {
      1: { active: false, bet: 0, cashedOut: false },
      2: { active: false, bet: 0, cashedOut: false }
    };
    
    let globalMult = 1.00;
    let gamePhase = 'waiting'; // 'waiting' (таймер 5 сек) или 'flying' (полет)
    let waitTimer = 5;
    let mainInterval = null;
    let currentCrashPoint = 1.00;

    const botNames = ['Artem_99', 'CryptoKing', 'Sasha_Star', 'DotaMaster', 'LuckyBoy', 'GaoPlayer', 'TonInvestor', 'Ivan_22'];

    async function init() {
      const user = getSafeUser();
      try {
        const res = await fetch(`${BACKEND_URL}/api/user/${user.id}`);
        if(res.ok) {
          const data = await res.json();
          balance = data.balance || 0;
          updateBalance();
        }
      } catch(e){}
      startEngineLoop();
    }

    function updateBalance() {
      document.getElementById('balanceText').innerText = balance;
    }

    function switchView(view) {
      document.getElementById('viewHome').style.display = view === 'home' ? 'flex' : 'none';
      document.getElementById('viewRocket').style.display = view === 'rocket' ? 'flex' : 'none';
    }

    function changeBet(boxId, amount) {
      if (amount === 'max') bets[boxId] = balance;
      else bets[boxId] = Math.max(1, bets[boxId] + amount);
      document.getElementById(`betText${boxId}`).innerText = bets[boxId];
    }

    // ИГРОВОЙ ЦИКЛ С ТАЙМЕРОМ И АВТОНОМНЫМ ЗАПУСКОМ
    function startEngineLoop() {
      runWaitingPhase();
    }

    function runWaitingPhase() {
      gamePhase = 'waiting';
      waitTimer = 5;
      globalMult = 1.00;
      document.getElementById('rocketDisplay').innerText = "1.00x";
      
      // Сброс кнопок ставок для нового раунда
      [1, 2].forEach(id => {
        rocketState[id].cashedOut = false;
        if (!rocketState[id].active) {
          document.getElementById(`btnBet${id}`).innerText = id === 1 ? "Сделать ставку" : "Сделать ставку #2";
          document.getElementById(`btnBet${id}`).style.background = "var(--accent-gold-gradient)";
        }
      });

      const timerInterval = setInterval(() => {
        waitTimer--;
        if (waitTimer > 0) {
          document.getElementById('rocketSubText').innerText = `Следующий раунд через ${waitTimer} сек. (Боты ставят)`;
        } else {
          clearInterval(timerInterval);
          startFlyingPhase();
        }
      }, 1000);
      document.getElementById('rocketSubText').innerText = `Следующий раунд через 5 сек. (Боты ставят)`;
    }

    function startFlyingPhase() {
      gamePhase = 'flying';
      
      // УМНАЯ СХЕМА УДЕРЖАНИЯ: Если реальные игроки забрали деньги, ракета может улететь до 1000х!
      const r = Math.random();
      if (r < 0.04) {
        currentCrashPoint = 1.00; // Мгновенный краш 4% раундов
      } else {
        // Проверяем, забрал ли реальный игрок ставки
        const realPlayerCashed = (rocketState[1].active && rocketState[1].cashedOut) || (rocketState[2].active && rocketState[2].cashedOut) || (!rocketState[1].active && !rocketState[2].active);
        
        if (realPlayerCashed && Math.random() < 0.35) {
          // Триггер "улетаем в космос", раз реальный игрок уже вышел
          currentCrashPoint = parseFloat((150 + Math.random() * 850).toFixed(2)); // от 150х до 1000х!
        } else {
          // Стандартный RTP 95%
          currentCrashPoint = Math.max(1.05, parseFloat((0.95 / (1 - Math.random() * 0.95)).toFixed(2)));
          if (currentCrashPoint > 45) currentCrashPoint = parseFloat((3 + Math.random() * 25).toFixed(2));
        }
      }

      mainInterval = setInterval(() => {
        globalMult += 0.04;
        document.getElementById('rocketDisplay').innerText = globalMult.toFixed(2) + 'x';
        document.getElementById('rocketSubText').innerText = "🚀 Полет ракеты...";

        // Проверка автовыхода реального игрока
        [1, 2].forEach(id => {
          if (rocketState[id].active && !rocketState[id].cashedOut) {
            // Если игрок нажал забрать
          }
        });

        if (globalMult >= currentCrashPoint) {
          triggerCrash();
        }
      }, 80);
    }

    function triggerCrash() {
      clearInterval(mainInterval);
      gamePhase = 'crashed';
      document.getElementById('rocketDisplay').innerText = "💥 CRASH";
      document.getElementById('rocketSubText').innerText = `Ракета взорвалась на ${globalMult.toFixed(2)}x`;

      // Проигрыш для тех, кто не успел забрать
      [1, 2].forEach(id => {
        if (rocketState[id].active && !rocketState[id].cashedOut) {
          rocketState[id].active = false;
          document.getElementById(`btnBet${id}`).innerText = "Проиграно";
          document.getElementById(`btnBet${id}`).style.background = "#555";
        }
      });

      // Добавляем в историю
      addHistoryPill(globalMult.toFixed(2) + 'x');

      // Пауза 3 секунды перед новым таймером
      setTimeout(() => {
        runWaitingPhase();
      }, 3000);
    }

    // Обработка нажатия кнопки ставки реальным игроком
    function handleRocketBet(boxId) {
      const state = rocketState[boxId];
      const btn = document.getElementById(`btnBet${boxId}`);

      if (gamePhase === 'waiting') {
        // Ставка во время таймера
        if (!state.active) {
          if (bets[boxId] > balance) { alert("Недостаточно средств"); return; }
          balance -= bets[boxId];
          updateBalance();
          state.bet = bets[boxId];
          state.active = true;
          state.cashedOut = false;
          btn.innerText = "Отменить / Ждать";
          btn.style.background = "#0098ea";
        } else {
          balance += state.bet;
          updateBalance();
          state.active = false;
          btn.innerText = boxId === 1 ? "Сделать ставку" : "Сделать ставку #2";
          btn.style.background = "var(--accent-gold-gradient)";
        }
      } else if (gamePhase === 'flying') {
        // Кнопка превращается в «Забрать» прямо во время полета
        if (state.active && !state.cashedOut) {
          state.cashedOut = true;
          state.active = false;
          const winAmount = Math.floor(state.bet * globalMult);
          balance += winAmount;
          updateBalance();
          btn.innerText = `Забрано (+${winAmount} ⭐)`;
          btn.style.background = "#2ed573";
        }
      }
    }

    function addHistoryPill(text) {
      const strip = document.getElementById('historyStrip');
      const pill = document.createElement('div');
      pill.className = 'history-pill';
      pill.innerText = text;
      strip.prepend(pill);
      if (strip.children.length > 10) strip.lastChild.remove();
    }

    function openCashier() { document.getElementById('cashierModal').style.display = 'flex'; }
    function openAdminModal() { document.getElementById('adminModal').style.display = 'flex'; }
    function closeModal(e) { if(e.target.classList.contains('modal-overlay')) e.target.style.display = 'none'; }

    async function adminGiveStars() {
      const amt = parseInt(document.getElementById('adminInput').value) || 0;
      const user = getSafeUser();
      const res = await fetch(`${BACKEND_URL}/api/admin/give-stars`, {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ adminId: user.id, targetUserId: user.id, amount: amt })
      });
      const data = await res.json();
      if(data.success) { balance = data.newBalance; updateBalance(); alert('Баланс пополнен!'); document.getElementById('adminModal').style.display='none'; }
    }

    async function makeDeposit() {
      const amt = parseInt(document.getElementById('depAmount').value) || 50;
      const user = getSafeUser();
      const res = await fetch(`${BACKEND_URL}/api/create-stars-invoice`, {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ userId: user.id, starsAmount: amt })
      });
      const data = await res.json();
      if(data.invoiceLink && tg?.openInvoice) {
        tg.openInvoice(data.invoiceLink, (status) => {
          if(status === 'paid') { balance += amt; updateBalance(); document.getElementById('cashierModal').style.display='none'; }
        });
      }
    }

    window.addEventListener('load', init);
  </script>
</body>
</html>
